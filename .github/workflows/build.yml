name: Compilar Biblioteca

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            python: "3.11"
          - name: macos-apple-silicon
            os: macos-14
            python: "3.11"
          - name: macos-intel
            os: macos-15-intel
            python: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias del sistema (macOS, nanoe5)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "LDFLAGS=-L$(brew --prefix libomp)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> $GITHUB_ENV
          echo "CFLAGS=-I$(brew --prefix libomp)/include" >> $GITHUB_ENV

      - name: Configurar MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar MSYS2 (MinGW, Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openmp

      - name: Configurar compilador MinGW (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "[build]" > "$USERPROFILE/pydistutils.cfg"
          echo "compiler = mingw32" >> "$USERPROFILE/pydistutils.cfg"
          echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH
          echo "CC=gcc" >> $GITHUB_ENV

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==75.8.2"
          python -m pip install -r requirements-windows.txt   # ← solo esta línea

      - name: Descargar modelo de traducción
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Prukario/opus-mt-es-en-ct2-int8', local_dir='modelos/opus-mt-es-en-ct2-int8')"

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --onedir --noconfirm --noupx --name biblioteca \
            --collect-all nanoe5 \
            --collect-all ctranslate2 \
            --collect-all sentencepiece \
            --collect-submodules rank_bm25 \
            --collect-data docx \
            --exclude-module matplotlib --exclude-module tkinter \
            --collect-submodules segno \
            --add-data "modelos/opus-mt-es-en-ct2-int8;modelos/opus-mt-es-en-ct2-int8" \
            servidor.py

      - name: Compilar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m PyInstaller --onedir --noconfirm --noupx --name biblioteca \
            --collect-all nanoe5 \
            --collect-all ctranslate2 \
            --collect-all sentencepiece \
            --collect-submodules rank_bm25 \
            --collect-data docx \
            --exclude-module matplotlib --exclude-module tkinter \
            --collect-submodules segno \
            --add-data "modelos/opus-mt-es-en-ct2-int8:modelos/opus-mt-es-en-ct2-int8" \
            servidor.py

      - name: Prueba de humo (arrancar, subir un texto y buscarlo)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/biblioteca/biblioteca.exe; else BIN=dist/biblioteca/biblioteca; fi
          "$BIN" > salida.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/ > /dev/null; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then echo "El servidor no arrancó:"; cat salida.log; exit 1; fi
          echo "Texto de prueba sobre aprendizaje automatico y redes neuronales en bibliotecas digitales" > prueba.txt
          curl -sf -F "file=@prueba.txt" http://127.0.0.1:5000/subir | grep -E '"exito": ?true' || { cat salida.log; exit 1; }
          curl -sf "http://127.0.0.1:5000/buscar?q=aprendizaje" | grep -q "prueba.txt" || { cat salida.log; exit 1; }
          curl -sf -F "file=@prueba.txt" -F "coleccion=pruebas" http://127.0.0.1:5000/subir | grep -E '"exito": ?true' || { cat salida.log; exit 1; }
          curl -sf "http://127.0.0.1:5000/buscar?q=aprendizaje&coleccion=pruebas" | grep -q "pruebas/prueba.txt" || { cat salida.log; exit 1; }
          curl -sf http://127.0.0.1:5000/qr.svg | grep -q "<svg" || { cat salida.log; exit 1; }
          curl -sf "http://127.0.0.1:5000/buscar?q=c%C3%B3mo%20escribir%20funciones" > /dev/null || { cat salida.log; exit 1; }
          echo "Prueba de humo OK"
          kill $PID 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM biblioteca.exe || true; fi
          sleep 3
          rm -rf dist/biblioteca/biblioteca.db dist/biblioteca/mis_pdfs || true

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p paquete/Biblioteca
          cp -R dist/biblioteca paquete/Biblioteca/biblioteca
          cp packaging/Iniciar.command packaging/LEEME-mac.txt paquete/Biblioteca/
          chmod +x paquete/Biblioteca/Iniciar.command paquete/Biblioteca/biblioteca/biblioteca
          ditto -c -k --keepParent paquete/Biblioteca Biblioteca-${{ matrix.name }}.zip

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/biblioteca -DestinationPath Biblioteca-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-${{ matrix.name }}
          path: Biblioteca-${{ matrix.name }}.zip

      - name: Adjuntar al Release (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Biblioteca-${{ matrix.name }}.zip